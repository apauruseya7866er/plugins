name: Source Health

# Live-checks every shipped English plugin against its real site and publishes
# the result three ways:
#
#   1. GitHub Pages  - apauruseya7866er.github.io/plugins, a page that fetches
#      source-health.json at view time. This is the live artefact: it always shows
#      the newest completed run, so it cannot go stale the way a committed table
#      does.
#   2. README badge  - health.svg, embedded in README.md. Also live, because an
#      <img> is refetched; it carries the summary, not the whole table.
#   3. README table  - a committed snapshot between the SOURCE_HEALTH markers.
#      Deliberately not the primary view: a table is 63 rows of text that a
#      committed copy freezes, and a stale table that looks current is worse than
#      no table. It stays for readers on plain git mirrors, for search, and for
#      diffing run over run in history.
#
# All three are generated from one JSON payload by one script, so the snapshot and
# the live page can never disagree about the same run.
#
# The job never fails on plugin health. A scraper breaking is normal and is
# reported by the data, not by a red build - failing here would train everyone to
# ignore the workflow and block unrelated plugin work. It fails only if the
# harness itself cannot run.

on:
  schedule:
    # 04:17 UTC daily. An off-minute avoids the top-of-hour GitHub Actions
    # scheduling congestion that delays scheduled runs.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language directory to check'
        required: false
        default: 'english'
        type: choice
        options:
          - english
          - arabic
          - chinese
          - french
          - indonesian
          - japanese
          - korean
          - multi
          - polish
          - portuguese
          - russian
          - spanish
          - thai
          - turkish
          - ukrainian
          - vietnamese
      concurrency:
        description: 'Parallel site checks'
        required: false
        default: '12'
        type: string

concurrency:
  group: source-health
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Live source health
    runs-on: ubuntu-latest
    # 63 English plugins at concurrency 12 takes ~4 minutes locally. Allow
    # generous headroom for slower runner networking plus per-site 30s timeouts.
    timeout-minutes: 45

    outputs:
      counts: ${{ steps.publish.outputs.counts }}
      generated_at: ${{ steps.publish.outputs.generated_at }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the repository's documented minimum (Node >= 22) and the
          # esbuild target used by the live checker.
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Live Checks and Publish
        id: publish
        env:
          LANG_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.lang || 'english' }}
          CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '12' }}
        run: |
          set -uo pipefail
          node scripts/publish-health.js "${LANG_DIR}" "${CONCURRENCY}" 2>&1 | tee health-output.txt
          status=${PIPESTATUS[0]}
          if [ "${status}" != "0" ]; then
            echo "::error::publish-health.js exited ${status} - harness failure, not a plugin health issue."
            echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
            exit "${status}"
          fi
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

          # Lift the counts into step outputs for the summary, rather than
          # re-parsing the table.
          counts=$(node -e "process.stdout.write(JSON.stringify(require('./site/source-health.json').counts))")
          stamp=$(node -e "process.stdout.write(require('./site/source-health.json').generatedAt)")
          echo "counts=${counts}" >> "$GITHUB_OUTPUT"
          echo "generated_at=${stamp}" >> "$GITHUB_OUTPUT"

      - name: Refresh the README Snapshot
        if: steps.publish.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          # The snapshot is spliced from the same JSON the live page reads, so the
          # two cannot drift.
          node --input-type=module -e "
            import fs from 'fs';
            const { spliceIntoReadme } = await import('./scripts/lib/health-shared.js');
            const readme = fs.readFileSync('README.md', 'utf8');
            const table = fs.readFileSync('site/README-table.md', 'utf8').trimEnd();
            fs.writeFileSync('README.md', spliceIntoReadme(readme, table), 'utf8');
          "
          git diff --stat -- README.md || true

      - name: Commit Snapshot
        if: steps.publish.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README snapshot unchanged."
          else
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: refresh source health snapshot'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Pages Artifact
        if: steps.publish.outputs.exit_code == '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.publish.outputs.exit_code == '0'
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Summarise Results
        if: always()
        run: |
          {
            echo "## Source health run"
            echo
            echo "- Generated: \`${{ steps.publish.outputs.generated_at }}\`"
            echo "- Counts: \`${{ steps.publish.outputs.counts }}\`"
            if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
              echo "- Live page: ${{ steps.deployment.outputs.page_url }}"
            fi
            echo
            echo '```'
            cat health-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"